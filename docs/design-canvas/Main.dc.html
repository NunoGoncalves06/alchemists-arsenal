<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap');
    :root{
      --ink-900:#1b141f;--ink-800:#241a2b;--ink-700:#33263c;
      --parchment:#efe2c4;--parchment-dim:#c9b892;
      --wood:#6b4a2f;--wood-dark:#3f2c1c;
      --candle:#e8b64c;--candle-hot:#f6d873;--witch:#7b4d9e;
      --danger:#d64550;--ok:#4fae5a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:1280px;height:720px;overflow:hidden;background:var(--ink-900);
      font-family:'Pixelify Sans',ui-monospace,monospace;color:var(--parchment);
      -webkit-font-smoothing:none;image-rendering:pixelated}
    h1,h2,.disp{font-family:'Silkscreen','Pixelify Sans',monospace;letter-spacing:.03em}
    a{color:var(--candle)} a:hover{color:var(--candle-hot)}
    .stage{position:absolute;inset:0;
      background:
        radial-gradient(120% 90% at 78% 42%, rgba(232,182,76,.16), transparent 60%),
        linear-gradient(180deg,#2b2036 0%, #1b141f 70%)}
    /* cottage parallax, flat blocks not gradients */
    .layer{position:absolute}
    .wall{right:0;top:0;width:64%;height:100%;background:#2c2033;
      border-left:3px solid var(--wood-dark)}
    .beam{position:absolute;background:var(--wood);border:2px solid var(--wood-dark)}
    .shelf{right:6%;top:20%;width:44%;height:14px}
    .jar{position:absolute;width:26px;height:34px;background:var(--witch);
      border:2px solid var(--wood-dark);border-radius:2px}
    .cauldron{right:16%;bottom:12%;width:190px;height:150px}
    .pot{position:absolute;left:0;bottom:0;width:190px;height:110px;background:#20161c;
      border:3px solid var(--wood-dark);border-radius:0 0 40px 40px}
    .brew{position:absolute;left:14px;top:-8px;width:162px;height:26px;background:var(--candle);
      border:3px solid var(--wood-dark)}
    .cat{position:absolute;left:8%;bottom:16%;width:74px;height:38px;background:#151016;
      border:2px solid var(--wood-dark);border-radius:18px 18px 6px 6px}
    .menu{position:absolute;left:9%;top:50%;transform:translateY(-50%);width:34%}
    .title{font-size:30px;color:var(--candle);line-height:1.15;text-shadow:3px 3px 0 var(--ink-900)}
    .subtitle{font-family:'Pixelify Sans',monospace;color:var(--parchment-dim);margin:12px 0 34px;font-size:15px}
    .btnstack{display:flex;flex-direction:column;gap:12px;width:280px}
    .btn{font-family:'Silkscreen',monospace;font-size:13px;text-align:left;
      background:var(--ink-800);color:var(--parchment);border:2px solid var(--wood);
      box-shadow:4px 4px 0 var(--wood-dark);padding:13px 16px;display:flex;gap:12px;align-items:center}
    .btn .k{width:14px;height:14px;flex:0 0 auto;color:var(--candle)}
    .btn.primary{background:var(--candle);color:var(--ink-900);border-color:var(--wood-dark)}
    .btn.primary .k{color:var(--ink-900)}
    .btn.disabled{opacity:.4}
    .ver{position:absolute;left:9%;bottom:22px;color:var(--parchment-dim);font-size:12px}
    .credit{position:absolute;right:18px;bottom:14px;color:var(--parchment-dim);font-size:11px;text-align:right}
  </style>
</helmet>

<div class="stage">
  <div class="layer wall"></div>
  <div class="layer beam shelf"></div>
  <div class="layer jar" style="right:10%;top:12%"></div>
  <div class="layer jar" style="right:18%;top:13%;background:#4f7a3a"></div>
  <div class="layer jar" style="right:26%;top:12%;background:#3f8fd0"></div>
  <div class="layer jar" style="right:34%;top:13%;background:#c451a8"></div>
  <div class="layer beam" style="right:4%;top:0;width:10px;height:100%"></div>
  <div class="layer beam" style="right:0;top:44%;width:64%;height:10px"></div>
  <div class="layer cauldron">
    <div class="brew"></div>
    <div class="pot"></div>
  </div>
  <div class="layer cat"></div>

  <div class="menu">
    <div class="title">ALCHEMIST'S<br>ARSENAL</div>
    <div class="subtitle">Brew by morning. Send them to fight by noon.<br>Read the diary by candlelight.</div>
    <div class="btnstack">
      <div class="btn primary">
        <svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        CONTINUE — DAY 4
      </div>
      <div class="btn">
        <svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        NEW GAME
      </div>
      <div class="btn">
        <svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        SETTINGS
      </div>
      <div class="btn">
        <svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h11l3 3v13H6zM9 4v6h7"/></svg>
        CREDITS
      </div>
      <div class="btn disabled">
        <svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        QUIT
      </div>
    </div>
  </div>

  <div class="ver">v0.1 · preview build</div>
  <div class="credit">All art · music · sound created in-house</div>
</div>
</x-dc>
</body>
</html>
